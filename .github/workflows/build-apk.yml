
name: Generar APK ECO-RASTRO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q ECO-RASTRO-Proyecto-Completo-v3.zip -d proyecto
          test -f proyecto/settings.gradle
          test -f proyecto/app/build.gradle

      - name: Compilar aplicación
        run: gradle -p proyecto assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-RASTRO-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          
